<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Elara — personal style intelligence</title>
  <desc id="description">A visual system map from personal context through Elara's style engine to a confident decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#160F26"/>
      <stop offset="0.45" stop-color="#2B1238"/>
      <stop offset="1" stop-color="#0C2940"/>
    </linearGradient>
    <linearGradient id="pink" x1="70" y1="80" x2="1075" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDA4AF"/>
      <stop offset="0.5" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="430" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <circle cx="1055" cy="55" r="132" fill="#22D3EE" fill-opacity="0.13" filter="url(#soft)"/>
    <circle cx="142" cy="410" r="155" fill="#F472B6" fill-opacity="0.15" filter="url(#soft)"/>
    <g opacity="0.22">
      <path d="M0 70H1200M0 130H1200M0 190H1200M0 250H1200M0 310H1200M0 370H1200" stroke="#E9D5FF" stroke-width="0.6"/>
      <path d="M40 0V430M100 0V430M160 0V430M220 0V430M280 0V430M340 0V430M400 0V430M460 0V430M520 0V430M580 0V430M640 0V430M700 0V430M760 0V430M820 0V430M880 0V430M940 0V430M1000 0V430M1060 0V430M1120 0V430M1180 0V430" stroke="#E9D5FF" stroke-width="0.6"/>
    </g>
    <text x="70" y="66" fill="#FBCFE8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="4">ELARA / PERSONAL STYLE INTELLIGENCE</text>
    <text x="70" y="109" fill="#FFF7ED" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">From personal context to a confident decision.</text>
    <text x="70" y="138" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="15">An AI system designed to help people get dressed with more clarity and less noise.</text>
    <path d="M280 270H454M730 270H906" stroke="url(#pink)" stroke-width="2" stroke-dasharray="7 9" opacity="0.86">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="3s" repeatCount="indefinite"/>
    </path>
    <g filter="url(#glow)">
      <circle cx="366" cy="270" r="5" fill="#F9A8D4"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="818" cy="270" r="5" fill="#67E8F9"><animate attributeName="r" values="7;4;7" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <rect x="70" y="205" width="210" height="126" rx="16" fill="url(#card)" stroke="#FDA4AF" stroke-opacity="0.44"/>
      <text x="94" y="238" fill="#FDA4AF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">SIGNALS</text>
      <text x="94" y="271" fill="#FFF7ED" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">The person</text>
      <text x="94" y="298" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="14">Wardrobe · taste · occasion</text>
      <text x="94" y="318" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="14">budget · weather · culture</text>
    </g>
    <g>
      <rect x="454" y="181" width="276" height="178" rx="18" fill="#1D1534" fill-opacity="0.86" stroke="url(#pink)" stroke-width="1.5"/>
      <rect x="471" y="198" width="242" height="144" rx="12" fill="url(#card)"/>
      <text x="488" y="228" fill="#F0ABFC" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.4">THE ELARA ENGINE</text>
      <text x="488" y="265" fill="#FFF7ED" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Style, with context</text>
      <path d="M488 285H692" stroke="#F0ABFC" stroke-opacity="0.45"/>
      <text x="488" y="310" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Creative reasoning + grounded checks</text>
      <text x="488" y="330" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="13.5">for recommendations that can be trusted.</text>
    </g>
    <g>
      <rect x="906" y="205" width="224" height="126" rx="16" fill="url(#card)" stroke="#67E8F9" stroke-opacity="0.48"/>
      <text x="930" y="238" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">OUTCOME</text>
      <text x="930" y="271" fill="#FFF7ED" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">A clear next look</text>
      <text x="930" y="298" fill="#E0F2FE" font-family="Arial, Helvetica, sans-serif" font-size="14">Distinct directions</text>
      <text x="930" y="318" fill="#E0F2FE" font-family="Arial, Helvetica, sans-serif" font-size="14">with useful reasons.</text>
    </g>
    <text x="600" y="399" text-anchor="middle" fill="#FCE7F3" fill-opacity="0.82" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">CONTEXT IN · CONFIDENCE OUT</text>
  </g>
</svg>
