name: Refresh profile metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify GraphQL retry behavior
        run: node --test scripts/github-graphql.test.mjs
      - name: Generate current metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-impact-metric.mjs
      - name: Commit the refreshed metric
        run: |
          if git diff --quiet -- assets/impact.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/impact.svg
          git commit -m "chore: refresh profile metrics"
          git push
